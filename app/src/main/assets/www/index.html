<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#14120E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>HTFU</title>
<style>
  /* HTFU 2.0 type scale: 12 / 14 / 16 / 20 / 28 / 40 px. Display numbers only: 64 (rest), 120 (reps), 140 (hands-free). */
  :root {
    --bg: #14120E;
    --bg2: #1C1914;
    --card: #242019;
    --line: #3A342A;
    --ink: #F4EDE2;
    --muted: #A89B8C;
    --accent: #E85D04;
    --accent2: #F4A261;
    --onaccent: #1A0E05;
    --good: #7DCE82;
    --ongood: #10210F;
    --goodtext: #7DCE82;
    --bad: #FF7A6B;
    --warn: #E8C547;
    --nav: #100e0b;
    --pill: #1A1713;
    --warnbtn: #3A342A;
    --donebg: #243024;
    --doneline: #345C38;
    --navpill: #3A2614;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="light"] {
    --bg: #F6F1E8;
    --bg2: #EFE8DC;
    --card: #FFFCF7;
    --line: #E0D4C4;
    --ink: #1C1612;
    --muted: #6E6256;
    --accent: #E85D04;
    --accent2: #9E3A06;
    --onaccent: #1A0E05;
    --good: #2F7D46;
    --ongood: #FFFFFF;
    --goodtext: #1F6634;
    --bad: #B42318;
    --warn: #8A6A12;
    --nav: #FFFCF7;
    --pill: #F3EBDF;
    --warnbtn: #E7DDD0;
    --donebg: #E3F0E6;
    --doneline: #9CC7A6;
    --navpill: #FBE3D0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    min-height: 100dvh;
    padding-bottom: calc(84px + var(--safe-b));
  }
  body.insession, body.nonav { padding-bottom: var(--safe-b); }
  body.insession .nav, body.nonav .nav { display: none; }
  button, input, select, textarea { font-family: inherit; }
  h1, h2, p { margin: 0; }
  h2 { font-size: 20px; line-height: 1.25; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 18px 16px 8px; }
  .kicker { letter-spacing: 0.14em; text-transform: uppercase; font-size: 12px; color: var(--accent2); font-weight: 700; }
  .title { font-size: 28px; line-height: 1.1; margin: 4px 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.45; }
  .note { color: var(--muted); font-size: 14px; line-height: 1.45; }
  .row { display: flex; gap: 10px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px;
    margin-top: 12px;
  }
  .stat { flex: 1; }
  .stat b { display: block; font-size: 28px; letter-spacing: -0.02em; }
  .stat span { color: var(--muted); font-size: 12px; }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 10px; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 0%; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  input[type="number"], input[type="time"], input[type="text"], input[type="date"], input:not([type]), select, textarea {
    width: 100%; min-height: 48px; background: var(--pill); color: var(--ink); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px; font-size: 20px; display: block;
  }
  input[type="checkbox"] { width: 24px; height: 24px; accent-color: var(--accent); flex: none; margin: 0; }
  input::placeholder { color: var(--muted); opacity: 1; }
  input[type="date"] { color-scheme: dark; }
  :root[data-theme="light"] input[type="date"] { color-scheme: light; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .hd { flex: 1; min-width: 0; }
  .iconbtn, .cog {
    width: 48px; height: 48px; min-width: 48px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font-size: 20px; cursor: pointer; flex: none;
    display: inline-flex; align-items: center; justify-content: center; padding: 0;
  }
  .iconbtn svg, .cog svg { width: 24px; height: 24px; }
  .menu-item {
    width: 100%; min-height: 48px; text-align: left; background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-weight: 700; font-size: 16px; cursor: pointer;
  }
  .menu-item.title { font-weight: 800; font-size: 20px; margin: 0; letter-spacing: 0; line-height: 1.2; }
  .menu-item.sub { margin-left: 56px; width: calc(100% - 56px); font-weight: 600; font-size: 16px; color: var(--ink); display: flex; align-items: center; gap: 8px; }
  .days { display: flex; flex-wrap: wrap; gap: 8px; }
  .shiftrow { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .shiftgrab { width: 48px !important; min-width: 48px; max-width: 48px; flex: 0 0 48px; padding: 0 !important; font-size: 20px; }
  .shiftname { flex: 1 1 auto; width: auto !important; min-width: 0; }
  .daytog {
    min-height: 48px; min-width: 52px; border: 1px solid var(--line); background: var(--pill); color: var(--ink);
    border-radius: 999px; padding: 0 14px; font-weight: 700; font-size: 16px; cursor: pointer;
  }
  .daytog.on { background: var(--accent); color: var(--onaccent); border-color: var(--accent); }
  .switch { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 48px; }
  .btn {
    border: 0; border-radius: 14px; padding: 12px 16px; font-weight: 700; min-height: 48px;
    font-size: 16px; cursor: pointer; width: 100%; color: var(--ink);
  }
  .btn[style*="font-size"] { font-size: 14px !important; }
  .btn.primary { background: var(--accent); color: var(--onaccent); }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn.good { background: var(--good); color: var(--ongood); }
  .btn.warn { background: var(--warnbtn); color: var(--ink); }
  .btn:active, .iconbtn:active, .daytog:active { transform: translateY(1px); }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  .btn-row .btn { flex: 1; }
  .nav {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--nav); border-top: 1px solid var(--line);
    display: flex; padding: 4px 4px calc(4px + var(--safe-b));
    z-index: 5;
  }
  .nav button {
    flex: 1; min-height: 64px; background: none; border: 0; color: var(--muted); cursor: pointer;
    font-size: 12px; font-weight: 700; padding: 6px 0 4px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .nav button .ico { width: 56px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; }
  .nav button svg { width: 24px; height: 24px; }
  .nav button.on { color: var(--ink); }
  .nav button.on .ico { background: var(--navpill); color: var(--accent2); }
  .ov {
    position: fixed; inset: 0; background: rgba(0,0,0,0.62);
    z-index: 80; display: flex; align-items: flex-start; justify-content: center;
    padding: 24px 12px; overflow: auto;
  }
  .ov-box { width: min(520px, 100%); background: var(--bg); border-radius: 18px; padding: 12px; }
  #repOv { background: var(--bg); align-items: center; }
  #repOvNum { font-size: 140px; line-height: 0.9; text-align: center; font-variant-numeric: tabular-nums; }
  .ov-box .card { margin-top: 8px; }
  .set-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pill {
    background: var(--pill); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 12px; font-size: 14px; color: var(--ink);
  }
  .pill.now { border-color: var(--accent); border-width: 2px; color: var(--ink); font-weight: 700; }
  .pill.done { background: var(--donebg); color: var(--goodtext); border-color: var(--doneline); }
  .pill.done::before { content: "✓ "; }
  .pill.done.miss { background: var(--pill); border-color: var(--bad); }
  .pill.done.miss::before { content: "✗ "; }
  .big {
    font-size: 120px; line-height: 0.95; letter-spacing: -0.04em; text-align: center;
    font-variant-numeric: tabular-nums; margin: 4px 0;
  }
  .center { text-align: center; }
  .timer {
    font-size: 64px; text-align: center; font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  .daycard { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .daycard:last-child { border-bottom: 0; }
  .tag { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent2); font-weight: 700; }
  .here { color: var(--bad); font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }
  .here::before { content: "● "; }
  .hit, .note .hit { color: var(--goodtext) !important; font-weight: 800; }
  .miss, .note .miss { color: var(--bad) !important; font-weight: 800; }
  .sub .hit::after, .note .hit::after { content: "✓"; font-size: 12px; margin-left: 1px; }
  .sub .miss::after, .note .miss::after { content: "✗"; font-size: 12px; margin-left: 1px; }
  ul.tips { margin: 8px 0 0; padding-left: 18px; color: var(--ink); font-size: 16px; }
  ul.tips li { margin: 6px 0; line-height: 1.4; }
  .log { font-size: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .log > div:first-child { flex: 1; min-width: 0; }
  .log:last-child { border-bottom: 0; }

  /* 2.0 components */
  .stepper { display: flex; align-items: center; gap: 8px; margin: 2px 0 8px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .stepper i { width: 28px; height: 6px; border-radius: 3px; background: var(--line); display: inline-block; }
  .stepper i.on { background: var(--accent); }
  .err { color: var(--bad); font-weight: 700; }
  .seg { display: flex; background: var(--pill); border: 1px solid var(--line); border-radius: 14px; padding: 3px; gap: 3px; }
  .seg button, button.seg span { flex: 1; }
  .seg button { min-height: 48px; border: 0; border-radius: 11px; background: transparent; color: var(--ink); font-weight: 700; font-size: 16px; cursor: pointer; padding: 0 10px; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--onaccent); }
  button.seg { width: 100%; min-height: 48px; cursor: pointer; font-family: inherit; }
  button.seg span { min-height: 40px; border-radius: 11px; display: flex; align-items: center; justify-content: center; color: var(--ink); font-weight: 700; font-size: 16px; }
  button.seg span.on { background: var(--accent); color: var(--onaccent); }
  .switchbtn { position: relative; width: 64px; min-width: 64px; height: 48px; border: 0; background: none; cursor: pointer; padding: 0; flex: none; }
  .switchbtn::before { content: ""; position: absolute; left: 6px; top: 8px; width: 52px; height: 32px; border-radius: 16px; background: var(--pill); border: 2px solid var(--muted); box-sizing: border-box; transition: background .15s; }
  .switchbtn::after { content: ""; position: absolute; left: 12px; top: 14px; width: 20px; height: 20px; border-radius: 50%; background: var(--muted); transition: transform .15s; }
  .switchbtn[aria-checked="true"]::before { background: var(--accent); border-color: var(--accent); }
  .switchbtn[aria-checked="true"]::after { transform: translateX(20px); background: var(--onaccent); }
  details.sect { background: var(--card); border: 1px solid var(--line); border-radius: 18px; margin-top: 12px; }
  details.sect > summary { list-style: none; cursor: pointer; min-height: 64px; padding: 12px 48px 12px 16px; position: relative; display: flex; flex-direction: column; justify-content: center; }
  details.sect > summary::-webkit-details-marker { display: none; }
  details.sect > summary::after { content: ""; position: absolute; right: 20px; top: 50%; width: 10px; height: 10px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: translateY(-70%) rotate(45deg); }
  details.sect[open] > summary::after { transform: translateY(-30%) rotate(-135deg); }
  details.sect > summary b { font-size: 16px; }
  details.sect > summary .note { margin-top: 2px; }
  details.sect > .sect-body { padding: 0 16px 16px; }
  details.sect .sect-body > .blk + .blk { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 14px; }
  .nextline { font-size: 16px; font-weight: 700; color: var(--ink); margin-top: 10px; }
  details.typebox { margin-top: 10px; }
  details.typebox > summary { list-style: none; min-height: 48px; display: flex; align-items: center; justify-content: center; color: var(--ink); font-size: 14px; font-weight: 700; cursor: pointer; border-radius: 12px; }
  details.typebox > summary::-webkit-details-marker { display: none; }
  details.typebox > summary::before { content: "✎ "; margin-right: 4px; }
  .sess { display: flex; flex-direction: column; min-height: calc(100dvh - 26px - var(--safe-b)); }
  .sess .sesscard { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .dock { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0 calc(10px + var(--safe-b)); margin-top: 12px; z-index: 4; }
  .dock .btn-row { margin-top: 8px; }
  .btn.huge { min-height: 26vh; font-size: 40px; font-weight: 800; border-radius: 22px; }
  .btn.huge small { display: block; font-size: 14px; font-weight: 700; margin-top: 4px; }
  .dock .btn.huge.good { background: var(--good); color: var(--ongood); }
  .btn.huge small { font-size: 16px; }
  body.kbd .dock { position: static; }
  body.kbd .dock .btn.huge { min-height: 72px; font-size: 28px; }
  .unitbox { position: relative; margin-top: 10px; }
  .unitbox input { padding-right: 56px; text-align: left; }
  .unitbox .unit { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 16px; font-weight: 700; color: var(--muted); pointer-events: none; }
  .ring { display: block; margin: 8px auto 0; width: 240px; height: 240px; }
  .ring .trk { stroke: var(--line); }
  .ring .arc { stroke: var(--accent); transition: stroke-dashoffset .25s linear; }
  .ringwrap { position: relative; width: 240px; margin: 0 auto; }
  .ringwrap .timer { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .more { position: relative; }
  .menu-pop { display: none; margin-top: 8px; }
  .menu-pop.open { display: block; }
  .menu-pop .menu-item + .menu-item { margin-top: 6px; }
  .empty { text-align: center; padding: 24px 16px; }
  .empty .em-ico { font-size: 40px; line-height: 1; }
  .empty h2 { margin: 10px 0 6px; }
  details.wk > summary { list-style: none; cursor: pointer; min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  details.wk > summary::-webkit-details-marker { display: none; }
  details.wk[open] > summary .note { visibility: hidden; }
  .empty .em-ico svg { width: 40px; height: 40px; color: var(--accent2); }
  .chart { color: var(--ink); }
  .axis { fill: var(--muted); }
  .chart .pbtxt { fill: var(--accent2); }
  .chart .pbdot { fill: var(--accent); }
  .chart .pick { fill: none; stroke: var(--accent2); stroke-width: 2; }
  .chartpick { margin-top: 6px; min-height: 20px; }

  .splash {
    position: fixed; inset: 0; z-index: 50; background: #050505;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .45s ease;
  }
  .splash.hide { opacity: 0; pointer-events: none; }
  /* 2.07 */
  .chiprow { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 6px 0; }
  p.note .chiprow { justify-content: flex-start; margin: 6px 0 0; }
  .btn.chip { width: auto; min-height: 48px; min-width: 48px; padding: 0 14px; margin: 0; font-size: 14px; }
  p.note .btn.chip { margin: 4px 0 0 4px; vertical-align: middle; }
  .warnline { color: var(--ink); }
  .warmrow { display: flex; align-items: center; gap: 12px; padding: 6px 0; border-top: 1px solid var(--line); }
  .warmrow:first-of-type { border-top: 0; }
  .warmtick { width: 48px; min-width: 48px; height: 48px; margin: 0; padding: 0; font-weight: 700; }
  .warmtxt { display: flex; flex-direction: column; }
  .platevis { display: flex; align-items: center; height: 80px; margin: 8px 0; }
  .platevis .pbar { display: block; width: 60px; height: 8px; background: var(--muted); border-radius: 2px; }
  .platevis .pl { display: block; width: 12px; margin-left: 3px; background: var(--accent); border-radius: 3px; }
  .prcard { border: 2px solid var(--accent); }
  .schemes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
  .btn.scheme { margin: 0; min-height: 48px; display: flex; align-items: center; gap: 10px; justify-content: flex-start; padding: 0 12px; }
  .btn.scheme[aria-pressed="true"] { border: 2px solid var(--accent); font-weight: 700; }
  .sw { display: inline-block; width: 22px; height: 22px; border-radius: 50%; flex: none; border: 1px solid var(--line); }
  .sw-orange { background: #E85D04; } .sw-blue { background: #1D5BD6; } .sw-green { background: #16773A; } .sw-purple { background: #6D35E0; } .sw-red { background: #C8232A; } .sw-teal { background: #0D6E67; } .sw-contrast { background: linear-gradient(90deg, #000 50%, #FFD400 50%); }
  .hmhead { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .hmgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 6px; }
  .hmdow { text-align: center; font-size: 12px; color: var(--muted); }
  .hm { display: flex; align-items: center; justify-content: center; aspect-ratio: 1; border-radius: 8px; font-size: 13px; color: var(--ink); background: var(--bg2); border: 1px solid transparent; }
  .hm.e { background: transparent; }
  .hm.h1, .hm.h2 { background: var(--accent); color: var(--onaccent); font-weight: 700; }
  .hm.h2 { box-shadow: inset 0 0 0 3px var(--onaccent); }
  .hm.miss { border: 1px dashed var(--muted); }
  .hm.plan { border: 1px solid var(--muted); }
  .hm.today { outline: 2px solid var(--ink); outline-offset: 1px; }
  .hm.key { display: inline-block; width: 14px; height: 14px; aspect-ratio: auto; vertical-align: middle; margin: 0 4px 0 10px; }
  .hmkey { margin-top: 8px; }
  .bodyrow { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
  .bodyrow > div { flex: 1; display: flex; flex-direction: column; }
  :root[data-scheme="blue"] { --accent: #4C8DF6; --accent2: #9CC3FF; --onaccent: #04112A; --navpill: #132640; }
  :root[data-theme="light"][data-scheme="blue"] { --accent: #1D5BD6; --accent2: #1849B0; --onaccent: #FFFFFF; --navpill: #DCE8FD; }
  :root[data-scheme="green"] { --accent: #2FBF62; --accent2: #8BE3A8; --onaccent: #04210F; --navpill: #12301E; }
  :root[data-theme="light"][data-scheme="green"] { --accent: #16773A; --accent2: #14612F; --onaccent: #FFFFFF; --navpill: #D8F3E1; }
  :root[data-scheme="purple"] { --accent: #A68AF9; --accent2: #C9B9FD; --onaccent: #1A0D33; --navpill: #2A1F47; }
  :root[data-theme="light"][data-scheme="purple"] { --accent: #6D35E0; --accent2: #5B25C7; --onaccent: #FFFFFF; --navpill: #ECE6FD; }
  :root[data-scheme="red"] { --accent: #F0645F; --accent2: #FFA9A3; --onaccent: #2A0606; --navpill: #3B1515; }
  :root[data-theme="light"][data-scheme="red"] { --accent: #C8232A; --accent2: #A51C22; --onaccent: #FFFFFF; --navpill: #FCE1E1; }
  :root[data-scheme="teal"] { --accent: #22BFAE; --accent2: #7FE3D6; --onaccent: #032724; --navpill: #0F302C; }
  :root[data-theme="light"][data-scheme="teal"] { --accent: #0D6E67; --accent2: #0B5953; --onaccent: #FFFFFF; --navpill: #D2F3EE; }
  :root[data-scheme="contrast"] { --accent: #FFD400; --accent2: #FFE45C; --onaccent: #000000; --navpill: #2A2400; --bg: #000000; --bg2: #0B0B0B; --card: #121212; --pill: #0B0B0B; --nav: #000000; --line: #9A9A9A; --ink: #FFFFFF; --muted: #D6D6D6; --warnbtn: #333333; --donebg: #0E2A12; --doneline: #5BD27A; }
  :root[data-theme="light"][data-scheme="contrast"] { --accent: #0031C4; --accent2: #0028A3; --onaccent: #FFFFFF; --navpill: #DCE4FF; --bg: #FFFFFF; --bg2: #F0F0F0; --card: #FFFFFF; --pill: #F0F0F0; --nav: #FFFFFF; --line: #4D4D4D; --ink: #000000; --muted: #2E2E2E; --warnbtn: #DDDDDD; --donebg: #E3F3E6; --doneline: #2F7D46; }

.vh207{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
.photopick{display:flex;align-items:center;justify-content:center;min-height:48px}
.photopick{position:relative}
.ph213head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ph213wrap{position:relative;margin-top:8px;touch-action:pan-y}
.ph213wrap img{width:100%;display:block;border-radius:12px;min-height:120px;background:var(--bg2)}
.ph213nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;min-width:48px;border-radius:50%;border:2px solid rgba(255,255,255,.9);background:rgba(0,0,0,.6);color:#fff;font-size:32px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.5)}

.rn214{position:fixed;left:8px;right:8px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;margin:0;box-shadow:0 4px 18px rgba(0,0,0,.45)}
.cap214grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;max-height:52vh;overflow:auto}
.cap214ph{display:flex;flex-direction:column;gap:4px;padding:4px;border-radius:10px;border:2px solid var(--line,#555);background:var(--bg2);color:var(--ink);font:inherit;font-size:13px;min-height:48px;cursor:pointer}

.themes216 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 96px), 1fr)); gap: 8px; margin: 6px 0 0; }
.theme216 { display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 96px; padding: 8px 4px; background: var(--pill); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; font: inherit; font-size: 13px; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.theme216[aria-pressed="true"] { border: 2px solid var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.tsw216 { display: block; width: 60px; height: 44px; border-radius: 8px; border: 1px solid; padding: 6px; }
.tsw216 .tsw-card { display: flex; align-items: center; justify-content: space-between; height: 100%; border-radius: 4px; padding: 0 5px; }
.tsw216 b { font-size: 14px; line-height: 1; } .tsw216 i { display: block; width: 14px; height: 14px; border-radius: 3px; }
.tsw-iron b { font-family: "HT Oswald", sans-serif; } .tsw-olive b { font-family: "HT Stencil", sans-serif; } .tsw-chalk b { font-family: "HT Bebas", sans-serif; font-size: 17px; } .tsw-concrete b { font-family: "HT ArchivoBlack", sans-serif; } .tsw-neon b { font-family: "HT Chakra", sans-serif; }
.tn216 { text-align: center; line-height: 1.15; max-width: 100%; overflow-wrap: anywhere; }
:root[data-look="iron"] { --fdisp: "HT Oswald", "sans-serif-condensed", "Arial Narrow", sans-serif; --fbody: "sans-serif-condensed", "HT Condensed", "Arial Narrow", system-ui, sans-serif; --r216: 6px; }
:root[data-look="olive"] { --fdisp: "HT Stencil", "sans-serif-condensed", sans-serif; --fbody: "sans-serif-condensed", "HT Condensed", "Arial Narrow", system-ui, sans-serif; --r216: 3px; }
:root[data-look="chalk"] { --fdisp: "HT Bebas", "sans-serif-condensed", sans-serif; --fbody: system-ui, "Roboto", "Segoe UI", sans-serif; --r216: 4px; }
:root[data-look="concrete"] { --fdisp: "HT ArchivoBlack", sans-serif; --fbody: "HT Grotesk", system-ui, sans-serif; --r216: 0px; }
:root[data-look="neon"] { --fdisp: "HT Chakra", sans-serif; --fbody: "HT Chakra", system-ui, sans-serif; --r216: 10px; }
:root[data-look]:not([data-look="classic"]) body { font-family: var(--fbody); }
:root[data-look]:not([data-look="classic"]) :is(.title, h1, h2, .stat b, .btn, .kicker, .tag) { font-family: var(--fdisp); text-transform: uppercase; }
:root[data-look="iron"] .title, :root[data-look="chalk"] .title { letter-spacing: 0.02em; }
:root[data-look="olive"] .kicker { letter-spacing: 0.18em; }
:root[data-look]:not([data-look="classic"]) :is(.card, .btn, .pill, input, select, textarea, .ov-box) { border-radius: var(--r216) !important; }
:root[data-look="chalk"]:not([data-scheme="contrast"]) .btn.primary { background-image: repeating-linear-gradient(-45deg, transparent 0 18px, rgba(0,0,0,0.06) 18px 36px); }
:root.edge216 .btn.primary { border: 2px solid var(--ink); }
:root[data-look="concrete"] .card { border: 2px solid var(--hard); box-shadow: 4px 4px 0 var(--hard); }
:root[data-look="concrete"] .btn { border: 2px solid var(--hard); }
:root[data-look="concrete"] .nav { border-top: 3px solid var(--hard); }

function placeByMax(n) {
  state.best = n;
  state.onboarded = true;
  state.mode = "work";
  state.day = 0;
  state.bridgeN = 0;
  state.failWeek = 0;
  state.failCount = 0;
  state.done100 = n >= goal();
  state.easyPlaced = true;
  if (planId() === "pull") return placePull(n);
  if (n <= easyCut()) { state.track = "easy"; state.week = 1; state.col = 0; return; }
  state.track = "main";
  if (n <= 7) { state.week = 1; state.col = 0; return; }
  if (n >= 61) { state.week = 6; state.col = 2; }
  else if (n >= 51) { state.week = 6; state.col = 1; }
  else if (n >= 46) { state.week = 6; state.col = 0; }
  else if (n >= 41) { state.week = 5; state.col = 2; }
  else if (n >= 36) { state.week = 5; state.col = 1; }
  else if (n >= 31) { state.week = 5; state.col = 0; }
  else if (n >= 26) { state.week = 3; state.col = 2; }
  else if (n >= 21) { state.week = 3; state.col = 1; }
  else if (n >= 16) { state.week = 3; state.col = 0; }
  else if (n >= 11) { state.week = 1; state.col = 2; }
  else if (n >= 6) { state.week = 1; state.col = 1; }
  else { state.week = 1; state.col = 0; }
}
function placePull(n) {
  if (n <= 2) { state.track = "easy"; state.week = 1; state.col = 0; return; }
  state.track = "main";
  if (n >= 20) { state.week = 6; state.col = 2; }
  else if (n >= 18) { state.week = 5; state.col = 1; }
  else if (n >= 16) { state.week = 5; state.col = 0; }
  else if (n >= 15) { state.week = 3; state.col = 2; }
  else if (n >= 12) { state.week = 3; state.col = 1; }
  else if (n >= 9) { state.week = 3; state.col = 0; }
  else if (n >= 6) { state.week = 1; state.col = 2; }
  else if (n >= 3) { state.week = 1; state.col = 1; }
  else { state.week = 1; state.col = 0; }
}

function allPlanIds() {
  const seen = {};
  return ["push", "pull", "sl", "squat"].concat((state.customs || []).filter(c => c && c.id !== "squats" && !seen[c.id] && (seen[c.id] = true)).map(c => "c:" + c.id));
}
function planLabel(id) {
  if (id === "push") return "100 Pushups";
  if (id === "pull") return "20 Pullups";
  if (id === "sl") return "Stronglifts 5x5";
  if (id === "squat") return "100 Squats";
  const c = (state.customs || []).find(x => "c:" + x.id === id);
  return c ? c.name : "Workout";
}
function homePlans() {
  const known = allPlanIds();
  if (!state.homePlans) state.homePlans = [];
  state.homePlans = state.homePlans.filter(id => known.indexOf(id) >= 0);
  return state.homePlans;
}
function planOrder() {
  const home = homePlans();
  const order = (state.planOrder || []).filter(id => home.indexOf(id) >= 0);
  home.forEach(id => { if (order.indexOf(id) < 0) order.push(id); });
  state.planOrder = order;

function movePlan(id, dir) {
  const order = planOrder();
  const i = order.indexOf(id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= order.length) return;
  const tmp = order[i];
  order[i] = order[j];
  order[j] = tmp;
  state.planOrder = order;
  planMenu = id;
  save();
  renderPlans();
}

  return {
    unit: kg ? "kg" : "lb",
    next: "A",
    sessionN: 1,
    lifts: {
      squat: { w: kg ? 20 : 45, fails: 0 },
      bench: { w: kg ? 20 : 45, fails: 0 },
      row: { w: kg ? 30 : 65, fails: 0 },
      ohp: { w: kg ? 20 : 45, fails: 0 },
      dead: { w: kg ? 40 : 95, fails: 0 }
    }
  };
}
function ensureSl() {
  if (!state.sl || !state.sl.lifts) state.sl = slDefaults("lb");
  return state.sl;
}
function slStep(id) { return id === "dead" ? (ensureSl().unit === "kg" ? 5 : 10) : (ensureSl().unit === "kg" ? 2.5 : 5); }
function slStepFrom(used, id, dir) {
  const step = slStep(id);
  const n = Number(used) + dir * step;
  if (!Number.isFinite(n) || n < 0) return 0;
  return Math.round(n * 100) / 100;
}
function slLogs() {
  const logs = state.plan === "sl" ? state.logs : (state.byPlan && state.byPlan.sl && state.byPlan.sl.logs);
  return (Array.isArray(logs) ? logs : []).filter(l => l && /^Stronglifts /.test(l.label || "") && Array.isArray(l.lifts)).slice().sort((a, b) => a.t - b.t);
}
function slLiftName(id) {
  if (SL_LIFTS[id]) return SL_LIFTS[id];
  for (const d of slDays()) for (const ex of d.exercises || []) if ((ex.id || ex.name) === id) return ex.name;
  return id;
}
function slToUnit(w, from, to, id) {
  const n = Number(w);
  if (!Number.isFinite(n) || n < 0) return 0;
  if (!from || from === to) return Math.round(n * 100) / 100;
  const step = slPlate(id, to);
  return Math.round((to === "kg" ? n * LB_KG : n / LB_KG) / step) * step;
}
function slDeload(used, id) {

  return Math.round(Math.max(Math.min(used, bar), n) * 100) / 100;

function slNext(id, fallback) {

  let fails = 0;
  slLogs().forEach(l => {
    if (set && l.t < set.t) return;
    const g = l.lifts.find(x => x && (x.id ? x.id === id : x.name === name));
    if (!g || !Array.isArray(g.reps) || !g.reps.length) return;
    const used = slToUnit(g.w, g.unit || unit, unit, id);
    const target = Number(g.target) || 5;
    if (g.reps.every(r => Number(r) >= target)) { fails = 0; w = slStepFrom(used, id, 1); }

function slSync() {

    sl.lifts[id].fails = n.fails;

}

  }

    reps: setTarget(p.day.sets[0]) || 0,

    label: p.label,

  });

}

function renderWorkout() {

function finishSet(e) {
  if (!session || !session.sets || (e && e.currentTarget && e.currentTarget.isConnected === false)) return; // 2.10: stale double-tap
  const typed = document.getElementById("typed");
  if (typed && typed.value !== "") session.reps = Math.min(99999, Math.max(0, Number(typed.value) || 0));
  const s = session.sets[session.i];
  const need = s && s.max ? s.min : s;
  session.done.push(session.reps);
  session.missed = session.missed || [];
  session.missed.push(!s.max && session.reps < need);
  if (session.bestBefore === undefined) session.bestBefore = state.best == null ? null : state.best;
  if (s && s.max && session.reps > state.best) state.best = session.reps;
  session.i++;
  session.reps = session.i < session.sets.length ? (setTarget(session.sets[session.i]) || 0) : 0;
  if (session.i >= session.sets.length) return completeWorkout();
  saveSession();
  startRest(session.rest);
}

function completeWorkout() {
  clearInterval(tick);
  const finished = session;
  clearSession();
  const total = finished.done.reduce((a, b) => a + b, 0);
  const last = finished.done[finished.done.length - 1];
  const j = jBegin();
  if (finished.bestBefore !== undefined) j.before.best = finished.bestBefore;
  const missedAny = (finished.missed || []).some(Boolean);
  let max = null;
  (finished.sets || []).forEach((s, i) => { if (s && s.max && finished.done[i] != null) max = Math.max(max == null ? 0 : max, finished.done[i]); });
  const entry = {
    t: Date.now(),
    label: finished.label + " " + finished.dayName,
    planKey: finished.label + " " + finished.dayName,
    sets: finished.done.slice(),
    missed: (finished.missed || []).slice(),
    total, last
  };
  state.logs.unshift(entry);
  const wk = state.week;
  const res = advanceAfterWork(missedAny);
  jEnd(j, { type: "work", missed: missedAny, max }, entry);
  save();
  screen = "today";
  const rep = res === "repeat" ? `<p class="note" style="margin-top:8px">Sets were missed this week, so week ${wk} repeats from day 1.</p>` : "";
  $(`
    <div class="kicker">Session saved</div>
    <h1 class="title">${total} reps</h1>
    <div class="card">
      <p class="sub">Sets: ${finished.done.map((n, i) => `<span class="${finished.missed && finished.missed[i] ? "miss" : "hit"}">${n}</span>`).join(" · ")}</p>
      <p class="note" style="margin-top:8px">Best straight is now ${state.best}. Rest at least a day before the next session.</p>
      ${kcalLine211(entry, true)}${kcalInfo211()}

    </div>
  `);
  document.getElementById("home").onclick = () => { screen = "today"; render(); };
}

function advanceAfterWork(missedAny) {
  if (state.mode === "bridge") {
    state.bridgeN++;
    if (state.bridgeN % 4 === 3) state.mode = "test";
    return;
  }
  if (missedAny) state.weekMiss = true;
  const source = state.track === "easy" ? sources().easy : sources().program;
  const w = source.find(p => p.week === state.week);
  if (state.day < 2) { state.day++; return; }
  if (state.repeatMiss && state.weekMiss) { state.weekMiss = false; state.day = 0; return "repeat"; }
  state.weekMiss = false;
  if (w && w.testAfter) { state.mode = "test"; return; }
  state.week++;
  state.day = 0;
  if (state.track !== "easy" && state.week > 6) enterBridge();
}

function enterBridge() {
  state.mode = "bridge";
  state.week = 7;
  state.day = 0;
}

function renderTest() {

function saveTest() {
  const n = session.reps;
  clearSession();
  const j = jBegin();
  const entry = { t: Date.now(), label: "Max test", sets: [n], total: n, last: n };
  state.logs.unshift(entry);
  const note = applyTestN(n);
  jEnd(j, { type: "test", n }, entry);
  save();
  screen = "today";
  $(`
    <div class="kicker">Test saved</div>
    <h1 class="title">${n}</h1>

      <p class="sub">${esc(note)}</p>

    </div>
  `);
  document.getElementById("home").onclick = () => { screen = "today"; render(); };
}
function applyTestN(n) {
  if (state.best == null || n > state.best) state.best = n;
  state.weekMiss = false;
  if (n >= goal()) {
    state.done100 = true;
    state.mode = "work";
    return goal() + " straight. That is the goal.";
  }
  return applyGate(n);
}

function noteFail(repeatWeek, backWeek) {
  state.mode = "work";
  state.day = 0;
  if (state.failWeek === repeatWeek) state.failCount += 1;
  else { state.failWeek = repeatWeek; state.failCount = 1; }
  if (state.failCount >= 2) {
    state.week = backWeek;
    state.failWeek = 0;
    state.failCount = 0;
    return `Same cutoff missed twice. Back to week ${backWeek}.`;
  }
  state.week = repeatWeek;
  return `Short of the next band. Repeat week ${repeatWeek}. Miss it again and you go back one week.`;
}
function passGate() { state.failWeek = 0; state.failCount = 0; }
function applyGate(n) {
  if (planId() === "pull") return applyPullGate(n);
  if (n >= 100) {
    state.done100 = true;
    state.mode = "work";
    state.track = "main";
    passGate();
    return "100 straight. That is the goal.";
  }
  if (state.track === "easy") {
    state.mode = "work";
    state.day = 0;
    if (n >= 8) { passGate(); state.track = "main"; state.week = 1; state.col = 1; return planId() === "squat" ? "Foundation done. Week 1, 8–15." : "Foundation done. Week 1, 6–10 column."; }
    if (n >= 6) { passGate(); state.track = "main"; state.week = 1; state.col = 0; return planId() === "squat" ? "Foundation done. Week 1, 6–7." : "Foundation done. Week 1, easier column."; }
    state.track = "easy";
    return noteFail(4, 3);
  }
  if (state.week <= 2) {
    state.mode = "work";
    state.day = 0;
    if (n >= 26) { passGate(); state.week = 3; state.col = 2; return "Week 3, over-25 column."; }
    if (n >= 21) { passGate(); state.week = 3; state.col = 1; return "Week 3, 21–25 column."; }
    if (n >= 16) { passGate(); state.week = 3; state.col = 0; return "Week 3, 16–20 column."; }
    state.col = n >= 11 ? 2 : 1;
    return noteFail(2, 1);
  }
  if (state.week <= 4) {
    state.mode = "work";
    state.day = 0;
    if (n >= 41) { passGate(); state.week = 5; state.col = 2; return "Week 5, over-40 column."; }
    if (n >= 36) { passGate(); state.week = 5; state.col = 1; return "Week 5, 36–40 column."; }
    if (n >= 31) { passGate(); state.week = 5; state.col = 0; return "Week 5, 31–35 column."; }
    state.col = n >= 25 ? 2 : n >= 21 ? 1 : 0;
    return noteFail(4, 3);
  }
  if (state.week <= 5) {
    state.mode = "work";
    state.day = 0;
    if (n >= 61) { passGate(); state.week = 6; state.col = 2; return "Week 6, over-60 column."; }
    if (n >= 51) { passGate(); state.week = 6; state.col = 1; return "Week 6, 51–60 column."; }
    if (n >= 46) { passGate(); state.week = 6; state.col = 0; return "Week 6, 46–50 column."; }
    state.col = n >= 40 ? 2 : n >= 36 ? 1 : 0;
    return noteFail(5, 4);
  }
  if (state.mode === "bridge" || (state.mode === "test" && state.bridgeN % 4 === 3)) {
    if (n <= (state.lastBridge || 0)) {
      state.failCount = (state.failCount || 0) + 1;
      if (state.failCount >= 2) {
        state.mode = "work";
        state.week = 6;
        state.day = 0;
        state.bridgeN = 0;
        state.failCount = 0;
        return "Two bridge tests with no gain. Back to week 6.";
      }
    } else state.failCount = 0;
    state.lastBridge = n;
    state.mode = "bridge";
    state.bridgeN = 0;
    return `Not 100 yet (${n}). Bridge continues, retest every fourth session.`;
  }
  state.mode = "bridge";
  state.bridgeN = 0;
  state.failCount = 0;
  state.lastBridge = n;
  return `Not 100 yet (${n}). Bridge sessions start now: easier sets, retest every fourth session.`;
}
function applyPullGate(n) {
  if (n >= 20) {
    state.done100 = true;
    state.mode = "work";
    state.track = "main";
    passGate();
    return "20 straight. That is the goal.";
  }
  if (state.track === "easy") {
    state.mode = "work";
    state.day = 0;
    if (n >= 3) { passGate(); state.track = "main"; state.week = 1; state.col = 1; return "Foundation done. Week 1, 3–5 column."; }
    state.track = "easy";
    return noteFail(4, 3);
  }
  if (state.week <= 2) {
    state.mode = "work";
    state.day = 0;
    if (n >= 15) { passGate(); state.week = 3; state.col = 2; return "Week 3, 15+ column."; }
    if (n >= 12) { passGate(); state.week = 3; state.col = 1; return "Week 3, 12–14 column."; }
    if (n >= 9) { passGate(); state.week = 3; state.col = 0; return "Week 3, 9–11 column."; }
    state.col = n >= 6 ? 2 : n >= 3 ? 1 : 0;
    return noteFail(2, 1);
  }
  if (state.week <= 4) {
    state.mode = "work";
    state.day = 0;
    if (n >= 20) { passGate(); state.week = 5; state.col = 2; return "Week 5, 20-attempt column."; }
    if (n >= 18) { passGate(); state.week = 5; state.col = 1; return "Week 5, 18–19 column."; }
    if (n >= 16) { passGate(); state.week = 5; state.col = 0; return "Week 5, 16–17 column."; }
    state.col = n >= 15 ? 2 : n >= 12 ? 1 : 0;
    return noteFail(4, 3);
  }
  if (state.week <= 5) {
    state.mode = "work";
    state.day = 0;
    if (n >= 20) { passGate(); state.week = 6; state.col = 2; return "Week 6, 20-attempt column."; }
    if (n >= 18) { passGate(); state.week = 6; state.col = 1; return "Week 6, 18–19 column."; }
    if (n >= 16) { passGate(); state.week = 6; state.col = 0; return "Week 6, 16–17 column."; }
    state.col = n >= 18 ? 1 : 0;
    return noteFail(5, 4);
  }
  if (state.mode === "bridge" || (state.mode === "test" && state.bridgeN % 4 === 3)) {
    if (n <= (state.lastBridge || 0)) {
      state.failCount = (state.failCount || 0) + 1;
      if (state.failCount >= 2) {
        state.mode = "work";
        state.week = 6;
        state.day = 0;
        state.bridgeN = 0;
        state.failCount = 0;
        return "Two bridge tests with no gain. Back to week 6.";
      }
    } else state.failCount = 0;
    state.lastBridge = n;
    state.mode = "bridge";
    state.bridgeN = 0;
    return `Not 20 yet (${n}). Bridge continues, retest every fourth session.`;
  }
  state.mode = "bridge";
  state.bridgeN = 0;
  state.failCount = 0;
  state.lastBridge = n;
  return `Not 20 yet (${n}). Bridge sessions start now: easier sets, retest every fourth session.`;
}

function renderPlan() {
  if (!planOnHome()) return renderNoPlan();
  if (isCustom()) return renderCustomPlan();
  if (planId() === "sl") return renderSlPlan();
  const src = sources();
  const weekCard = (here, done, tagText, title, daysHtml, extra) => {
    const body = `<h2 style="margin:4px 0 8px">${title}</h2>${daysHtml}${extra}`;
    if (done && !here) return `<details class="card wk"><summary><span class="tag">${tagText} · done</span><span class="note">Show</span></summary>${body}</details>`;
    return `<div class="card"${here ? ' id="here"' : ""}><div class="tag">${tagText}${here ? " · <span class=\"here\">you are here</span>" : ""}</div>${body}</div>`;
  };
  const easyBlocks = src.easy.map(w => {
    const here = state.track === "easy" && w.week === state.week;
    const done = state.track !== "easy" || w.week < state.week;
    const label = w.label + " · " + easyCut() + " or under";
    const daysHtml = w.days.map((d, i) => `
      <div class="daycard">
        <div><b>Day ${i + 1}</b><div class="note">${d.rest}s rest</div></div>
        <div class="note">${coloredSets(d, label, i)}</div>

    return weekCard(here, done, esc(w.label), esc(maxLabel(easyCut() + " or under")), daysHtml,
      w.testAfter ? `<p class="note">Then a max test. ${planId() === "pull" ? "3 or more moves you to week 1." : planId() === "squat" ? "6–7 moves you to the 6–7 column. 8 or more moves you to 8–15." : "8 or more moves you to week 1."} Under the cutoff repeats this week.</p>` : "");
  }).join("");
  const blocks = src.program.map(w => {
    const col = w.columns[Math.min(state.col, w.columns.length - 1)];
    const show = state.track === "easy" ? w.columns[0] : col;
    const here = state.track !== "easy" && w.week === state.week && state.mode !== "bridge";
    const done = state.track !== "easy" && (state.mode === "bridge" || w.week < state.week);
    const label = `Week ${w.week} · ${show.label}`;
    const daysHtml = show.days.map((d, i) => `

    return weekCard(here, done, "Week " + w.week, esc(maxLabel(show.label)), daysHtml,

  $(`
    ${planOverviewHeader()}

    </div>

    </div>`}

    document.querySelectorAll("[data-edit-sl]").forEach(btn => btn.onclick = () => {
      state.slEdit = Number(btn.getAttribute("data-edit-sl"));
      screen = "sledit";

    });

    if (addDay) addDay.onclick = () => {
      const days = slDays();
      const next = String.fromCharCode(65 + days.length);
      days.push({ name: next, exercises: [{ id: "squat", name: "Squat", sets: 5, reps: 5, w: ensureSl().lifts.squat.w }] });

}
function askReset() {
  const box = document.getElementById("resetBox");
  if (!box) return;

  box.innerHTML = `<p class="sub">Reset progress for ${esc(name)}? This clears only this plan's log and week. Other plans stay as they are.</p>
    <div class="btn-row">

    </div>`;

function renderSquatForm() {
  $(`${formHeader("Count only clean reps")}<div class="card"><p class="note">${esc(formCue("Bodyweight squat"))}</p></div><div class="card"><div class="tag">Pain rule</div><p class="note" style="margin-top:6px">Sharp knee pain is a stop. Muscle burn is not. This is training, not medical advice.</p></div>`);
}
function renderForm() {
  if (!planOnHome()) return renderNoPlan();
  if (isCustom()) return renderCustomForm();
  if (planId() === "sl") return renderSlForm();
  if (planId() === "squat") return renderSquatForm();
  const pull = planId() === "pull";
  $(`
    ${formHeader("Count only clean reps")}
    <div class="card">
      <ul class="tips">
        ${pull ? `
        <li>${esc(formCue("Pullup"))}</li>
        <li>Cannot pull yet? A foundation 1 can be a slow 3-second negative from the top.</li>
        <li>Breathe out on the way up, in on the way down.</li>` : `
        <li>${esc(formCue("Pushup"))}</li>
        <li>Breathe in on the way down, out on the way up.</li>
        <li>Wrists sore? Make fists and use pushup bars, or do them on your knuckles.</li>`}
      </ul>
    </div>
    <div class="card">
      <div class="tag">Pain rule</div>
      <p class="note" style="margin-top:6px">Muscle burn is fine. Sharp pain in a shoulder, elbow, or wrist is a stop. Rest a few extra days and come back with slower reps. This is training, not medical advice.</p>
    </div>
  `);
}

    };
    document.getElementById("resetNo").onclick = () => { screen = "plan"; render(); };
  };

"Cable kickback": "Ankle strap on a low cable, facing the machine and holding on. Keeping the torso still with a slight knee bend, drive the leg straight back until the hip is fully extended, squeeze the glute, then return slowly. Do not arch the lower back.",
"Cable pull-through": "Face away from a low cable with the rope between the legs. Hinge at the hips with a flat back so the rope travels back between the thighs, then drive the hips forward to stand tall and squeeze the glutes. The arms just hold on.",
"Frog pump": "Lie on your back with the soles of the feet together, knees out and heels close to the glutes. Squeeze the glutes to lift the hips, pause at the top, then lower. Usually done for high reps.",
"Clamshell": "Lie on your side, knees bent and feet together, hips stacked. Keeping the feet touching, open the top knee as far as you can without rolling the pelvis back, then close. A band above the knees adds load. Switch sides.",
"Fire hydrant": "On all fours, keep the knee bent and lift one leg out to the side until the thigh is about parallel to the floor, without shifting your weight or twisting the trunk. Lower slowly. Switch sides.",
"Donkey kick": "On all fours, keep one knee bent at 90 degrees and push that foot up toward the ceiling until the thigh lines up with the body. Do not arch the lower back. Lower and repeat. Switch sides.",
"Monster walk": "Band around the legs above the knees or at the ankles, quarter-squat stance. Step sideways or diagonally forward, keeping tension on the band and the knees pushed out; do not let the feet come together. Each step is one rep.",
"Curtsy lunge": "Step one leg behind and across the other, as if curtsying, and lower until the front thigh is about parallel. Keep the hips square and the front knee tracking over the toes, then step back. Switch sides.",
"L-sit": "Hands on parallettes, dip bars or the floor beside the hips. Press down to lift the body with straight arms and shoulders pushed down, legs straight out in front at hip height. Hold. Tuck the knees if you cannot keep the legs up.",
"Dragon flag": "Lie on a bench gripping it behind your head. Lift the body up onto the upper back until it is nearly vertical, in a straight line from shoulders to toes, then lower as slowly as you can without bending at the hips. Keep the weight on the upper back and shoulders, never on the neck. Start with slow lowering-only reps.",
"Toes-to-bar": "Hang from a bar. Brace and lift the legs, as straight as you can, until the toes touch the bar between the hands, then lower under control. Strict reps avoid a big swing.",
"Hollow hold": "Lie on your back with the lower back pressed into the floor. Lift the shoulders and straight legs off the floor with the arms overhead, making a shallow banana shape, and hold without the lower back lifting. Bend the knees or bring the arms in to make it easier.",
"Copenhagen plank": "Side plank on one forearm with the top leg on a bench, inner knee or ankle on the edge, bottom leg free underneath. Lift the hips into a straight line and hold. Knee on the bench is easier, ankle is harder. Switch sides.",
"Pallof press": "Stand side-on to a cable or band at chest height with the handle at the breastbone. Brace and press the handle straight out, resisting the pull to rotate, hold briefly, then bring it back. Hips and shoulders stay square. Switch sides.",
"Cable woodchop": "Stand side-on to a cable set high with both hands on the handle. Rotate through the trunk and hips to pull the handle diagonally down across the body to the opposite hip, arms long, pivoting the back foot, then return slowly. A low-to-high chop is the same in reverse. Switch sides.",
"Russian twist": "Sit with the knees bent and heels on or just off the floor, leaning back about 45 degrees with a straight back. Rotate the shoulders to bring the hands, or a weight, beside one hip, then the other. Each side counts as one rep.",
"V-up": "Lie flat with the arms overhead. In one motion lift the straight legs and torso, reaching the hands toward the toes so the body makes a V, then lower under control.",
"Flutter kicks": "Lie on your back, hands under the hips, lower back pressed down. Lift straight legs an inch or two and kick them up and down in small, quick alternating movements, keeping the lower back on the floor.",
"Reverse crunch": "Lie on your back with the knees bent at 90 degrees above the hips. Curl the hips off the floor toward the ribs using the abs, not momentum, then lower slowly.",
"Cable crunch": "Kneel facing a high cable with the rope held beside the head. Keeping the hips still, curl the ribs toward the pelvis to crunch down, then return slowly. The spine bends; the hips do not sit back.",
"Dumbbell side bend": "Stand tall holding a dumbbell in one hand. Bend sideways toward the weight, then use the opposite side of the waist to pull yourself back upright. No twisting or leaning forward. Switch sides.",
"Suitcase carry": "Hold one heavy dumbbell or kettlebell at your side. Walk tall without leaning toward or away from the weight, shoulders level, then switch hands. Log the time per side.",
"Plank shoulder taps": "From a high plank with the feet wider than the hips, lift one hand to tap the opposite shoulder, then the other, without letting the hips rock. Each tap is one rep.",
"Landmine rotation": "Stand facing a landmine holding the end of the bar in both hands at arm's length in front of the face. Rotate the trunk and pivot the feet to bring the bar down in an arc toward one hip, then back over the top to the other. Arms stay long; hips turn with it.",
"Hang clean": "Stand with the bar at the thighs, then hinge so it slides to just above the knees. Jump explosively, shrug and pull yourself under, catching the bar on the front of the shoulders with the elbows high in a partial squat. Stand up. Learn it with a coach first.",
"Clean and jerk": "Clean the bar from the floor to the front rack and stand up, then dip, drive and jerk it overhead, splitting or pushing yourself under, and recover with the feet together and arms locked. Learn each part with a coach; technique matters more than weight.",
"Snatch": "Wide grip, bar over mid-foot. Lift the bar off the floor with a flat back, then jump explosively and pull yourself under to catch it overhead on locked arms in a squat or partial squat. Stand up with it overhead. Learn it with a coach and an empty bar.",
"Push jerk": "Bar in the front rack. Dip a couple of inches by bending the knees, drive up hard through the legs, then push yourself under the bar by re-bending the knees as the arms lock overhead. Stand up with the bar steady overhead, then lower it to the shoulders.",
"Thruster": "Barbell or dumbbells in the front rack. Squat to depth, then drive up and use that momentum to press the weight overhead in one smooth motion, finishing with the arms locked. Bring it back to the shoulders as you descend into the next squat.",
"Overhead squat": "Bar locked overhead with a wide grip, pushing up into the bar. Squat to depth keeping the bar over mid-foot and the chest up, then stand. Start with a PVC pipe or an empty bar.",
"Dumbbell snatch": "Dumbbell between the feet; hinge and grab it with one hand. Drive through the legs and hips to pull it up close to the body, then punch under to catch it straight overhead. Lower it to the floor in two stages. Reps are per arm: finish one side, then the other.",
"Wall ball": "Hold a medicine ball at the chest facing a wall. Squat to depth, then drive up and throw the ball to a target about 10 ft (3 m) high, catch it on the way down and flow into the next squat.",
"Medicine ball slam": "Use a dead (non-bouncing) slam ball so it cannot rebound into your face. Raise it overhead, then throw it into the floor in front of you as hard as you can, hinging and bracing as you go. Pick it up with a flat back and repeat.",
"Kettlebell clean": "Hike the bell back between the legs, then drive the hips forward and pull it up close to the body, letting it rotate around the hand to land softly in the rack position at the chest, wrist straight. Do not let it flip over and bang the forearm. Return through the legs.",
"Kettlebell snatch": "Hike the bell back, drive the hips forward and let it float up close to the body, punching the hand through at the top so the bell lands softly on the back of the forearm with the arm locked overhead. Drop it back down through the legs.",
"Kettlebell press": "Bell in the rack position with the wrist straight. Brace the glutes and abs and press straight overhead to a locked arm, biceps near the ear, without leaning back. Lower to the rack under control.",
"Kettlebell windmill": "Press a bell overhead with one arm locked, feet turned away from the bell side. Keep your eyes on the bell, push the hips out toward the bell side and hinge down, sliding the free hand toward the floor along the inside of the front leg. Stand back up. The overhead arm stays vertical.",
"Kettlebell halo": "Hold a light bell upside down by the horns at chest height. Circle it around the head close to the skull, elbows tight, keeping the trunk still. Reverse direction each set.",
"Kettlebell deadlift": "Bell between the feet. Hinge with a flat back, grip the handle, then stand up by driving the hips forward, and lower it the same way. The basic hinge pattern before swings.",
"Sled push": "Hands on the upright handles, body leaning at about 45 degrees. Drive the sled forward with short, powerful steps on the balls of the feet, keeping the back flat. Log the time, or count each length as a rep.",
"Yoke carry": "Get under the yoke crossbar like a high-bar squat, brace hard, stand it up, then walk with short quick steps, staying upright. Set it down by squatting it back to the ground. Log the time, or count each run as a rep.",
"Atlas stone": "Straddle the stone, reach down and wrap the arms around it, fingers spread. Roll it into your lap as you sit back, re-grip, then drive the hips forward and stand to load it onto the platform or over the bar. Lower it to the ground; never drop it near your feet.",
"Log press": "Clean the log to the chest, keeping it close and rolling it up the body. With the elbows high, dip and drive and press it overhead to locked arms, head through. Lower it to the chest, then to the floor.",
"Tire flip": "Squat down with the chest against the tire and the fingers under the bottom edge. Drive forward and up with the legs and hips, then switch the hands and push the tire over. Keep the chest on the tire instead of deadlifting it with a round back.",
"Sandbag carry": "Bear-hug a sandbag to the chest, or carry it on one shoulder, and walk with short steps and an upright back. Switch shoulders between sets if carrying it on the shoulder. Log the time.",
"Sandbag over shoulder": "Lift the sandbag from the floor to the lap, then explosively extend the hips to throw it over one shoulder, alternating sides. Let it drop behind you and reset.",
"Rowing machine": "Push with the legs first, then swing the torso back slightly, then pull the handle to the lower ribs. Return in reverse: arms out, lean forward, then bend the knees. The recovery takes about twice as long as the drive.",
"Assault bike": "Set the seat so the knee is slightly bent at the bottom of the stroke. Push and pull the handles as you pedal, driving through both. Pace long efforts; the fan makes it harder the faster you go.",
"Ski erg": "Stand facing the machine, arms high, handles in hand. Hinge at the hips and pull the handles down past the thighs, bending the knees slightly as the arms finish, then rise back to tall with the arms up. Power comes from the hinge and the lats, not only the arms.",
"Jump rope": "Elbows close to the sides, turn the rope with the wrists. Jump only an inch or so off the balls of the feet and land softly. Keep a steady rhythm.",
"Stair climber": "Stand tall and hold the rails lightly for balance only. Step with the whole foot and drive through the heel. Leaning on the rails cuts the work a lot.",
"Stair climb": "Climb a flight or tower of stairs at a steady pace, whole foot on each step, using the handrail lightly if needed. Walk down to recover.",
"Swimming": "Swim continuous laps at an even, sustainable pace in any stroke. Log the distance swum.",
"Cycling": "Ride at a steady effort with the saddle set so the knee is slightly bent at the bottom of the pedal stroke. Log the distance.",
"Stationary bike": "Set the saddle so the knee is slightly bent at the bottom of the stroke and pedal at a steady cadence against moderate resistance. Log the time.",
"Elliptical": "Stand tall, push and pull the handles and keep the whole foot on the pedals. Log the time.",
"Walk": "Walk at a brisk, steady pace with the arms swinging naturally. Log the distance.",
"Incline walk": "Treadmill at a steep incline, about 12 to 15 percent, at a brisk walking pace. Stand tall and do not hold the handrails; holding on cuts the work a lot. Log the time.",
"Ruck": "Walk with a loaded backpack, straps snug so the load sits high and close to the back. Upright posture, steady pace. Start light, around 20 lb (10 kg), and build up. Log the distance.",
"Battle ropes": "Hold one rope end in each hand in an athletic quarter-squat stance. Make fast alternating or double waves by moving the arms from the shoulders, keeping the waves travelling all the way to the anchor. Brace the core and work for time.",
"Jumping jacks": "Jump the feet out wide while bringing the arms overhead, then jump back to feet together with the arms at the sides. Land softly on the balls of the feet.",
"High knees": "Run in place driving the knees up to hip height, staying on the balls of the feet with the arms pumping. Work for time.",
"Shadowboxing": "Light on your feet in a fighting stance with the hands up. Throw punches in combinations at the air, keep moving and bring the hands back to the guard after every punch. Work for time.",
"Box jump": "Stand a step from a sturdy box. Swing the arms and jump up, landing softly on the whole foot with the knees bent, then stand tall. Step down rather than jumping down.",
"Broad jump": "Feet hip width. Swing the arms back as you hinge, then jump forward as far as you can, landing on both feet with the knees bent. Stick the landing before the next rep.",
"Depth jump": "Step off a low box, land on both feet and immediately jump up as high as you can, spending as little time on the ground as possible. Start with a box of about 12 in (30 cm).",
"Tuck jump": "Jump straight up and pull the knees toward the chest at the top, then extend the legs and land softly, going straight into the next jump.",
"Lateral bound": "Stand on one leg, then jump sideways onto the other foot, landing softly with the knee bent over the toes, and hold it briefly. Bound back the other way. Each landing is one rep.",
"Jumping lunge": "From a lunge, jump up and switch the legs in the air, landing softly in a lunge with the other leg forward. Keep the torso upright. Each landing is one rep.",
"Pogo hops": "Small, quick, stiff-ankled bounces on the balls of the feet with the knees almost straight, spending as little time on the ground as possible. The arms help with rhythm.",
"Pigeon stretch": "From all fours, bring one knee forward behind the same wrist with the shin angled across, and slide the other leg straight back. Square the hips and lower toward the floor until you feel a stretch in the front-leg glute. Breathe and hold. Switch sides.",
"Downward dog": "From all fours, lift the hips up and back into an upside-down V, hands pressing into the floor and heels reaching down. The knees can bend; aim for a long spine. Hold and breathe.",
"Cobra stretch": "Lie face down with the hands under the shoulders. Gently press the chest up, keeping the hips on the floor and the shoulders down, into a comfortable back bend. Hold and breathe.",
"Shoulder dislocates": "Hold a band or stick with a wide grip. With straight arms, lift it overhead and back behind you as far as is comfortable, then return to the front. Widen the grip if the elbows bend or the shoulders pinch.",
"Ankle mobility": "Half-kneel facing a wall with the front toes a couple of inches from it. Keep the heel down and drive the knee forward over the toes toward the wall, then back. Move the foot back as you gain range. Switch sides.",
"Foam rolling": "Roll slowly over the muscle, about an inch per second, pausing on tender spots for a few breaths. Do not roll directly over joints or the lower spine.",
"Wall slides": "Stand with the back, head and arms against a wall, elbows bent at 90 degrees like a goalpost. Slide the arms up the wall as far as you can while keeping the lower back, elbows and wrists in contact, then slide down.",
"Calf stretch": "Hands on a wall, one foot back with the heel down and the knee straight. Lean forward until you feel a stretch in the calf and hold, then bend the back knee slightly to stretch lower down. Switch sides.",
"Butterfly stretch": "Sit with the soles of the feet together and the knees out. Hold the feet, sit tall and let the knees drop toward the floor, gently leaning forward from the hips. No bouncing.",
"Cross-body shoulder stretch": "Bring one straight arm across the chest and use the other forearm to pull it gently toward the body, just above the elbow. Keep the shoulder down. Switch sides.",
"Supine spinal twist": "Lie on your back and bring one knee across the body toward the floor, keeping the opposite shoulder down with that arm reaching out to the side. Let the knee sink without forcing it. Switch sides.",
"Sled rope pull": "Attach a rope to the sled and walk it out. Stand or kneel facing the sled, brace with a flat back and pull the rope toward you hand over hand until the sled reaches you. Keep the hips low and the chest up. Log the time, or count each full pull as a rep.",
"Backward sled drag": "Face the sled holding the straps or handles with straight arms, sitting back into a quarter squat. Walk backward with short, quick steps, pushing through the balls of the feet and keeping the knees bent so the quads do the work. Log the time, or count each length as a rep.",
"Split jerk": "Bar in the front rack. Dip a couple of inches, drive up hard through the legs, then split the feet front and back as you punch under the bar, catching it on locked arms with the front shin vertical and the back knee soft. Step the front foot back, then the back foot forward, to finish. Learn it with a coach first.",
"Squat clean": "Start like a deadlift with the bar over mid-foot. Push the floor away, then jump hard and shrug as the bar passes the thighs, pull yourself under and catch it on the front of the shoulders, elbows high, in a full front squat. Stand up. Learn it with a coach first.",
"Stiff-leg deadlift": "Bar over mid-foot, knees only slightly bent and kept there. Hinge with a flat back to lift the bar from the floor, keeping it close to the legs, stand tall, then lower to the floor the same way. Unlike a Romanian deadlift, each rep starts from the floor. Start light.",
"Yates row": "Underhand grip about shoulder width. Hinge to about 30 degrees from upright, more upright than a strict barbell row, with a flat back. Pull the bar to the lower belly, elbows close, then lower to straight arms. Do not swing the torso to finish.",
"Weighted chinup": "Palms toward you, about shoulder width, with the weight hung from a belt or held between the feet. Start from a dead hang, pull until the chin clears the bar, then lower all the way. No kipping.",
"Hollow rock": "Get into a hollow hold: lower back pressed down, shoulders and straight legs off the floor, arms overhead. Keeping that shape, rock back and forth from the upper back to the hips. Each rock back and forth is one rep. If the lower back lifts, bend the knees.",
"Superman hold": "Lie face down with the arms reaching forward. Lift the chest, arms and legs a little off the floor, squeeze the glutes and hold, breathing steadily. Keep the neck long, eyes on the floor.",
"Sphinx stretch": "Lie face down and prop yourself on the forearms, elbows under the shoulders. Let the lower back relax into a gentle bend while the hips stay on the floor and the shoulders stay away from the ears. A gentler version of the cobra stretch. Hold and breathe.",
"Assisted pullup": "Kneel or stand on the assistance pad, or put a knee or foot in a band looped over the bar. Hands about shoulder width, palms forward. From straight arms, pull until the chin clears the bar, then lower all the way. Less assistance is harder.",
"Assisted dip": "Kneel on the assistance pad, or rest your knees or feet in a band, hands on the bars and shoulders down. Lower until the upper arms are about parallel to the floor, then press to locked elbows. Less assistance is harder; stop if the front of the shoulder hurts.",
"Smith machine squat": "Bar on the upper back, feet slightly in front of the bar and about shoulder width. Unhook, brace and sit until the thighs are at least parallel, then stand. Set the safety stops just below your bottom position.",
"Smith machine bench press": "Set the bench so the bar comes down over the lower chest. Shoulder blades back and down, feet flat. Unhook, lower to the chest under control, then press to locked elbows. Set the safety stops just above the chest.",
"Smith machine incline press": "Bench at about 30 degrees, placed so the bar comes down over the upper chest. Shoulder blades back, feet flat. Lower to the upper chest, then press to locked elbows. Set the safety stops just above the chest.",
"Smith machine shoulder press": "Seat or stand so the bar travels just in front of the face. Brace, lower the bar to about chin height, then press to locked elbows without arching the lower back.",
"Hip thrust machine": "Sit with the upper back on the pad and the belt or pad across the hips, feet flat about hip width. Drive the hips up until the torso and thighs are in line, squeeze the glutes, then lower under control. Do not over-arch the lower back.",
"Glute kickback machine": "Set up with the working foot on the plate or pad and the chest supported. Drive the leg back and up until the hip is fully extended, squeeze the glute, then return slowly. Keep the lower back still. Switch sides.",
"Leg press calf raise": "Sit in the leg press with the balls of the feet on the bottom edge of the platform, knees straight but not locked hard. Keep the safety catches set. Let the heels move back for a full stretch, then press through the toes as far as you can and pause.",
"Dumbbell lunge": "A dumbbell in each hand at your sides. Step forward and lower until the back knee is close to the floor, front heel down, torso tall, then push back to the start. Reps are per leg: finish one leg, then the other.",
"Barbell lunge": "Bar on the upper back as for a squat. Step forward and lower until the back knee is close to the floor, front heel down, torso tall, then push back to the start. Reps are per leg: finish one leg, then the other. Start light; balance is the limit.",
"Dumbbell walking lunge": "A dumbbell in each hand at your sides. Lunge forward, then bring the back foot through into the next step. Each step is one rep. Torso tall, front heel down, back knee toward the floor.",
"Goblet reverse lunge": "Hold a kettlebell or dumbbell at the chest. Step straight back and lower until both knees are near 90 degrees, front heel down, then drive through the front heel to stand. Reps are per leg: finish one leg, then the other.",
"Dumbbell Bulgarian split squat": "A dumbbell in each hand, back foot on a bench, front foot far enough forward that the knee stays over the ankle. Lower the back knee, front heel down, then stand. Reps are per leg: finish one leg, then the other.",
"Rope climb": "Grab the rope high, pull the knees up and clamp the rope between the feet (one foot on top, one underneath). Stand up on the foot lock, reach higher and repeat. Climb down hand under hand, never slide. Only climb as high as you can get down safely, over a mat. Each climb is one rep.",
"Bike erg": "Set the seat so the knee is slightly bent at the bottom of the stroke and the damper where pedalling feels like moderate resistance. Pedal at a steady cadence and log the distance from the monitor.",
"Treadmill incline run": "Treadmill at a moderate incline, about 5 percent, at a pace you can hold. Shorten the stride and lean slightly from the ankles; do not hold the rails. Log the time.",
"Single-arm dumbbell press": "Stand tall with one dumbbell at the shoulder and the free hand on the hip. Brace so you do not lean away, press the dumbbell straight overhead to a locked arm, then lower to the shoulder. Switch sides.",
"Side-lying leg raise": "Lie on your side with the bottom knee bent for balance and the top leg straight, in line with the body. Lift the top leg to about 45 degrees, leading with the heel and toes pointing forward, then lower slowly. Do not roll the hips back. Switch sides.",
"Ab crunch machine": "Sit with the chest or shoulders against the pads and the feet secured. Curl the ribs toward the hips to crunch forward, pause, then return slowly. Move through the spine, not by pulling with the arms.",
"Machine preacher curl": "Set the seat so the upper arms lie flat on the pad with the armpits at its top edge. Curl the handles up, squeeze, then lower until the arms are almost straight. Do not lift the elbows off the pad.",
"In and outs": "Ab Ripper X move. Sit on the floor, lean back on your hands or with the hands just off the floor, feet raised. Pull the knees in toward the chest, then extend the legs out long without touching the floor. Each in and out is one rep. Keep the lower back from rounding hard.",
"Reverse bicycle": "Ab Ripper X move. Same seated position as in and outs, leaning back on the hands with the feet off the floor. Pedal the legs backward in big circles, as if riding a bicycle in reverse. Each full pedal of one leg is one rep.",
"Crunchy frog": "Ab Ripper X move. Sit balanced on the glutes with the knees tucked and the arms wrapped around the shins. Extend the legs out and open the arms wide as you lean back, then pull everything back into the tuck. Each tuck and extension is one rep; the feet stay off the floor.",
"Wide-leg sit-up": "Ab Ripper X move. Lie on your back with the legs straight and wide apart, arms overhead. Sit up with a straight back and reach the hands toward the floor between the feet, then roll back down under control. Swing the arms gently if needed, but do not jerk the neck.",
"Fifer scissors": "Ab Ripper X move. Lie on your back, hands under the hips or at your sides, and lift the head and shoulders a little. Raise one straight leg toward the ceiling while the other hovers just off the floor, then switch, scissoring the legs. Each switch is one rep. Keep the lower back pressed down.",
"Hip rock and raise": "Ab Ripper X move. Lie on your back with the legs straight up, arms by your sides. Rock the hips back so the lower back curls off the floor, then press the feet straight up toward the ceiling, lifting the hips. Lower slowly; do not swing or roll onto the neck. Each rock and raise is one rep.",
"Pulse-up": "Ab Ripper X move. Lie on your back with the legs straight up and the hands under the hips or at your sides. Push the heels straight up toward the ceiling, lifting the hips a few inches off the floor, then lower. Do not swing the legs or push off the neck.",
"V-up/roll-up combo": "Ab Ripper X move. Lie flat with the arms overhead. Do a V-up, lifting the straight legs and torso to reach for the toes, and lower. Then do a roll-up: keep the legs on the floor and peel the spine up one segment at a time to reach the toes, and roll back down. One V-up plus one roll-up is one rep.",
"Oblique V-up": "Ab Ripper X move. Lie on one side, legs straight and stacked, bottom arm out in front for balance and the top hand behind the head. Lift the legs and the upper body together, squeezing the side of the waist, then lower. Reps are per side: finish one side, then the other.",
"Leg climb": "Ab Ripper X move. Lie on your back with one leg raised straight up and the other straight on or near the floor. Walk the hands up the raised leg toward the ankle, curling the upper body up, then walk back down. Alternate legs; each climb is one rep.",
"Mason twist": "Ab Ripper X move. Sit with the knees bent and the feet off the floor, leaning back with a straight back and the hands clasped. Rotate to touch the hands to the floor beside one hip, then the other, moving quickly with control. Each touch is one rep. Like the Russian twist but with the feet raised and a floor touch on each side.",
"Sprint": "Warm up fully first. Run as fast as you can for the set distance or time: tall posture, drive the arms and push the ground back behind you. Walk or rest fully between efforts.",
"Shuttle run": "Run to a line, touch it with a foot or hand, turn and run back. Drop the hips into each turn and push off hard. Run the set number of lengths or for time."
};
